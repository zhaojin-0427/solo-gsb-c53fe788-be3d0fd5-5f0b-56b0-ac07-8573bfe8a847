services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hss
      POSTGRES_PASSWORD: hss
      POSTGRES_DB: hss
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hss -d hss"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hss:hss@db:5432/hss
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin-secret}
    ports:
      - "8000:8000"

volumes:
  pgdata:
